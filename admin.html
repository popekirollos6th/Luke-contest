<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة نتائج مسابقة لوقا</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{font-family:Tahoma,Arial;background:#f4f6f0;color:#24352d;margin:0;padding:18px}.wrap{max-width:1050px;margin:auto}.card{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 20px #0001}input,button{font:inherit;padding:11px;border:1px solid #ccd5cc;border-radius:9px;margin:5px}button{background:#173f35;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;background:white}th,td{padding:11px;border-bottom:1px solid #e3e8e1;text-align:right}th{background:#173f35;color:white}#status{line-height:1.8}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#f4f6f0;padding:14px;border-radius:10px;min-width:130px}@media(max-width:600px){.tablewrap{overflow:auto}}</style></head><body><main class="wrap"><h1>لوحة نتائج مسابقة إنجيل لوقا</h1><section class="card"><h3>دخول المنسق</h3><p>سجّل الدخول ببريد المنسق وكلمة مرور حساب Supabase Auth.</p><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="login">دخول</button><button id="logout" hidden>تسجيل خروج</button><div id="status"></div></section><section id="dashboard" hidden><div class="card stats"><div class="stat">عدد المشاركين<br><strong id="count">0</strong></div><div class="stat">متوسط الدرجات<br><strong id="avg">0</strong></div><div class="stat">أعلى درجة<br><strong id="high">0</strong></div></div><section class="card"><label for="partFilter">عرض النتائج</label> <select id="partFilter" style="font:inherit;padding:10px;border:1px solid #ccd5cc;border-radius:9px"><option value="all">كل الأجزاء</option><option value="1">الجزء الأول (1–6)</option><option value="2">الجزء الثاني (7–12)</option></select> <button id="refresh">تحديث النتائج</button><button id="csv">تنزيل CSV</button><div class="tablewrap"><table><thead><tr><th>#</th><th>اسم المشارك</th><th>الجزء</th><th>الدرجة</th><th>النسبة</th><th>وقت الإنهاء</th></tr></thead><tbody id="rows"></tbody></table></div></section></section></main><script>
const statusEl=document.getElementById('status');let client=null,records=[];
if(window.supabase&&window.SUPABASE_URL&&!window.SUPABASE_URL.includes('YOUR_'))client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
else statusEl.textContent='أضف رابط المشروع والمفتاح العام في supabase-config.js ثم أعد تحميل الصفحة.';
async function load(){if(!client)return;const {data,error}=await client.from('quiz_attempts').select('full_name,part,score,total,finished_at,status').eq('status','finished').order('part',{ascending:true}).order('score',{ascending:false}).order('finished_at',{ascending:true});if(error){statusEl.textContent='تعذر تحميل النتائج: '+error.message;return;}records=data||[];renderRecords();statusEl.textContent='تم تحميل النتائج.';}
function renderRecords(){const filter=document.getElementById('partFilter').value;const shown=records.filter(r=>filter==='all'||String(r.part||1)===filter);document.getElementById('rows').innerHTML=shown.map((r,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(r.full_name)}</td><td>${Number(r.part||1)===1?'الأول (1–6)':'الثاني (7–12)'}</td><td>${r.score}/${r.total}</td><td>${Math.round(r.score/r.total*100)}%</td><td>${r.finished_at?new Date(r.finished_at).toLocaleString('ar-EG'):'—'}</td></tr>`).join('');document.getElementById('count').textContent=shown.length;document.getElementById('avg').textContent=shown.length?(shown.reduce((s,r)=>s+r.score,0)/shown.length).toFixed(1):'0';document.getElementById('high').textContent=shown.length?Math.max(...shown.map(r=>r.score))+'/20':'0';}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
document.getElementById('login').onclick=async()=>{if(!client)return;const {error}=await client.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){statusEl.textContent='تعذر تسجيل الدخول: '+error.message;return;}document.getElementById('dashboard').hidden=false;document.getElementById('logout').hidden=false;await load();};
document.getElementById('logout').onclick=async()=>{await client.auth.signOut();document.getElementById('dashboard').hidden=true;document.getElementById('logout').hidden=true;statusEl.textContent='تم تسجيل الخروج.'};document.getElementById('refresh').onclick=load;document.getElementById('partFilter').onchange=renderRecords;
document.getElementById('csv').onclick=()=>{const filter=document.getElementById('partFilter').value;const shown=records.filter(r=>filter==='all'||String(r.part||1)===filter);const rows=[['الاسم','الجزء','الدرجة','من','النسبة','وقت الإنهاء'],...shown.map(r=>[r.full_name,Number(r.part||1)===1?'الأول (1–6)':'الثاني (7–12)',r.score,r.total,Math.round(r.score/r.total*100)+'%',r.finished_at||''])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download='luke-quiz-results.csv';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
